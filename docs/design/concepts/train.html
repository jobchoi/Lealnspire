<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>컨셉 3 · 코드 기차 마을</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root { --sky1:#7dd3fc; --sky2:#e0f2fe; --grass:#84cc16; --grass2:#65a30d; --rail:#78350f; --wood:#b45309; --ink:#1c1917; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; font-family:'Do Hyeon', sans-serif; color:var(--ink); background: linear-gradient(var(--sky1), var(--sky2) 55%, var(--grass) 55%, var(--grass2)); overflow-x:hidden; }
.clouds { position:fixed; inset:0; pointer-events:none; background:
  radial-gradient(40px 22px at 12% 12%, #fff 98%, transparent), radial-gradient(60px 28px at 16% 10%, #fff 98%, transparent),
  radial-gradient(50px 24px at 72% 18%, #fff 98%, transparent), radial-gradient(70px 30px at 77% 15%, #fff 98%, transparent); animation: drift 40s linear infinite; }
@keyframes drift { to { transform: translateX(-8vw); } }
.wrap { position:relative; max-width:1100px; margin:0 auto; padding:18px 20px 30px; }
.sign { display:inline-flex; align-items:center; gap:12px; background:var(--wood); color:#fff7ed; padding:10px 22px; border-radius:10px; font-family:'Black Han Sans'; font-size:28px; box-shadow: inset 0 -6px 0 #0003, 0 8px 0 -2px #78350f; position:relative; }
.sign::before, .sign::after { content:''; position:absolute; bottom:-30px; width:8px; height:30px; background:#78350f; } .sign::before { left:30px; } .sign::after { right:30px; }
.sign small { font-family:'Do Hyeon'; font-size:16px; background:#fff7ed33; padding:2px 8px; border-radius:6px; }
/* 마을 지도 = 이소메트릭 섬 */
.island { margin:46px auto 0; width:min(560px, 92vw); aspect-ratio: 1.6; position:relative; }
.island svg { width:100%; height:100%; overflow:visible; filter: drop-shadow(0 18px 0 #3f6212); }
/* 기차 = 프로그램 */
.station { margin-top:44px; background:#fffbeb; border-radius:22px; padding:18px 20px 26px; box-shadow: 0 10px 0 #d6b98c, 0 30px 40px -20px #0006; position:relative; }
.station h2 { margin:0 0 4px; font-family:'Black Han Sans'; font-size:24px; }
.station p { margin:0 0 14px; color:#78716c; }
.track { position:relative; display:flex; align-items:flex-end; gap:6px; overflow-x:auto; padding:10px 6px 26px; }
.track::after { content:''; position:absolute; left:0; right:0; bottom:12px; height:8px; background: repeating-linear-gradient(90deg, var(--rail) 0 10px, transparent 10px 22px), linear-gradient(#57534e, #57534e) 0 0/100% 3px no-repeat, linear-gradient(#57534e, #57534e) 0 100%/100% 3px no-repeat; }
.engine, .car { flex: 0 0 auto; position:relative; z-index:1; }
.car { width:84px; height:70px; border-radius:12px 12px 6px 6px; background:var(--c); box-shadow: inset 0 -8px 0 #0002; display:grid; place-items:center; color:#fff; }
.car::before, .car::after, .engine::after { content:''; position:absolute; bottom:-10px; width:20px; height:20px; border-radius:50%; background:#292524; box-shadow: inset 0 0 0 5px #57534e; }
.car::before { left:10px; } .car::after { right:10px; }
.car svg { width:38px; height:38px; }
.car .no { position:absolute; top:4px; left:8px; font-size:14px; opacity:.85; }
.car.now { animation: chug .35s ease-in-out infinite alternate; } @keyframes chug { to { transform: translateY(-4px); } }
.coupler { width:10px; height:6px; background:#57534e; align-self:center; margin-bottom:-20px; z-index:0; }
.engine { width:120px; height:92px; } .engine svg { width:100%; height:100%; }
/* 반복 = 순환 선로 */
.loopline { flex:0 0 auto; display:flex; align-items:flex-end; gap:6px; padding:16px 12px 0; border:5px solid #f59e0b; border-bottom:0; border-radius:40px 40px 0 0; position:relative; margin-bottom:-4px; }
.loopline .badge { position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:#f59e0b; color:#fff; padding:2px 12px; border-radius:999px; font-size:18px; box-shadow:0 3px 0 #b45309; white-space:nowrap; }
/* 차고 = 블록 고르기 */
.depot { display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; }
.depot button { border:0; cursor:pointer; width:92px; padding:10px 0 8px; border-radius:14px; background:var(--c); color:#fff; font-family:inherit; font-size:15px; box-shadow: 0 6px 0 #0003; display:grid; justify-items:center; gap:4px; }
.depot button:active { transform:translateY(5px); box-shadow:none; }
.depot svg { width:34px; height:34px; }
.whistle { margin-left:auto; display:flex; gap:10px; align-items:center; }
.go { border:0; background:#dc2626 !important; cursor:pointer; background:#dc2626; color:#fff; font-family:'Black Han Sans'; font-size:26px; padding:12px 26px; border-radius:999px; box-shadow: 0 7px 0 #7f1d1d; display:flex; gap:10px; align-items:center; }
.go:active { transform:translateY(6px); box-shadow:none; }
.speed { background:#fff; border-radius:999px; padding:6px 12px; box-shadow: inset 0 0 0 3px #e7e5e4; font-size:20px; }
@media (max-width:760px) { .engine { width:90px; height:70px; } .car { width:64px; height:56px; } .car svg { width:28px; height:28px; } .whistle { margin-left:0; width:100%; justify-content:space-between; } }
</style></head><body>
<div class="clouds"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="up" viewBox="0 0 24 24"><path d="M12 3l7 8h-4v9H9v-9H5z" fill="currentColor"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M9 7V3L3 9l6 6v-4h5a4 4 0 0 1 4 4v5h3v-5a7 7 0 0 0-7-7z" fill="currentColor"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M15 7V3l6 6-6 6v-4h-5a4 4 0 0 0-4 4v5H3v-5a7 7 0 0 1 7-7z" fill="currentColor"/></symbol>
  <symbol id="loop" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8h-3a5 5 0 1 1-5-5v3l5-4.5L12 1z" fill="currentColor"/></symbol>
</defs></svg>
<div class="wrap">
  <div class="sign">코드 기차 마을 <small>6번 역 · 계단 언덕</small></div>
  <div class="island">
    <svg viewBox="0 0 400 250">
      <!-- 이소메트릭 4x4 섬 -->
      <defs>
        <g id="tile"><path d="M0 0 L40 -20 L80 0 L40 20 Z"/></g>
        <g id="block"><path d="M0 0 L40 -20 L80 0 L40 20 Z" fill="#a8a29e"/><path d="M0 0 L40 20 L40 44 L0 24 Z" fill="#78716c"/><path d="M80 0 L40 20 L40 44 L80 24 Z" fill="#57534e"/></g>
      </defs>
      <g transform="translate(200 40)">
        <!-- 땅 판 -->
        <path d="M0 -20 L160 60 L0 140 L-160 60 Z" fill="#a3e635"/><path d="M-160 60 L0 140 L0 168 L-160 88 Z" fill="#92400e"/><path d="M160 60 L0 140 L0 168 L160 88 Z" fill="#78350f"/>
        <!-- 길(선로) -->
        <path d="M-80 100 L-40 80 L0 100 L40 80 L80 60 L120 40" stroke="#fde68a" stroke-width="10" fill="none" stroke-linejoin="round" opacity=".8"/>
        <!-- 바위 언덕(벽) -->
        <use href="#block" transform="translate(-40 -24) scale(.5)"/><use href="#block" transform="translate(0 -4) scale(.5)"/><use href="#block" transform="translate(-80 -4) scale(.5)"/>
        <use href="#block" transform="translate(-120 16) scale(.5)"/><use href="#block" transform="translate(40 76) scale(.5)"/><use href="#block" transform="translate(80 56) scale(.5)"/>
        <!-- 나무 -->
        <g transform="translate(-130 70)"><rect x="-3" y="0" width="6" height="14" fill="#78350f"/><circle cy="-6" r="12" fill="#15803d"/></g>
        <g transform="translate(130 92)"><rect x="-3" y="0" width="6" height="14" fill="#78350f"/><circle cy="-6" r="12" fill="#16a34a"/></g>
        <!-- 역(도착) -->
        <g transform="translate(118 18)"><path d="M-16 8 L0 0 L16 8 L0 16Z" fill="#fca5a5"/><path d="M-16 8 L0 16 L0 30 L-16 22Z" fill="#fef3c7"/><path d="M16 8 L0 16 L0 30 L16 22Z" fill="#fde68a"/><path d="M-18 8 L0 -6 L18 8 L0 0Z" fill="#dc2626"/><rect x="-1" y="-26" width="2" height="18" fill="#1c1917"/><path d="M1 -26h10l-3 4 3 4H1z" fill="#dc2626"/></g>
        <!-- 꼬마 기차(로봇) -->
        <g transform="translate(-92 92)"><path d="M-12 0 L6 -9 L18 -3 L0 6Z" fill="#2563eb"/><path d="M-12 0 L0 6 L0 14 L-12 8Z" fill="#1d4ed8"/><path d="M18 -3 L0 6 L0 14 L18 5Z" fill="#1e40af"/><rect x="2" y="-20" width="6" height="12" fill="#1e293b"/><circle cx="5" cy="-24" r="4" fill="#fff" opacity=".8"/></g>
      </g>
    </svg>
  </div>
  <section class="station">
    <h2>기차를 이어 붙여요</h2>
    <p>칸 하나가 명령 하나. 노란 순환 선로 안의 칸은 여러 번 달려요.</p>
    <div class="track">
      <div class="engine"><svg viewBox="0 0 120 92"><rect x="10" y="30" width="80" height="44" rx="10" fill="#dc2626"/><rect x="60" y="8" width="34" height="40" rx="6" fill="#b91c1c"/><rect x="66" y="14" width="22" height="16" rx="4" fill="#bae6fd"/><rect x="18" y="14" width="14" height="20" fill="#1c1917"/><circle cx="25" cy="8" r="7" fill="#e7e5e4"/><path d="M90 60 L112 70 L90 74Z" fill="#facc15"/><circle cx="30" cy="80" r="11" fill="#292524"/><circle cx="72" cy="80" r="11" fill="#292524"/><circle cx="30" cy="80" r="5" fill="#a8a29e"/><circle cx="72" cy="80" r="5" fill="#a8a29e"/></svg></div>
      <span class="coupler"></span>
      <div class="loopline"><span class="badge">3바퀴 돌기</span>
        <div class="car now" style="--c:#2563eb"><span class="no">1</span><svg><use href="#up"/></svg></div><span class="coupler"></span>
        <div class="car" style="--c:#16a34a"><span class="no">2</span><svg><use href="#left"/></svg></div><span class="coupler"></span>
        <div class="car" style="--c:#2563eb"><span class="no">3</span><svg><use href="#up"/></svg></div><span class="coupler"></span>
        <div class="car" style="--c:#16a34a"><span class="no">4</span><svg><use href="#right"/></svg></div>
      </div>
    </div>
    <div class="depot">
      <button style="--c:#2563eb"><svg><use href="#up"/></svg>앞으로 칸</button>
      <button style="--c:#16a34a"><svg><use href="#left"/></svg>왼쪽 칸</button>
      <button style="--c:#16a34a"><svg><use href="#right"/></svg>오른쪽 칸</button>
      <button style="--c:#f59e0b"><svg><use href="#loop"/></svg>순환 선로</button>
      <div class="whistle"><span class="speed">느림 · 보통 · 빠름</span><button class="go">출발!</button></div>
    </div>
  </section>
</div>
</body></html>
